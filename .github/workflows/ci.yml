name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: bash scripts/check-no-secrets.sh
      - run: npm run lint
      - run: npm run format:check
      - run: npm run compile

  # macOS hosted runners are currently capacity-starved: jobs sit queued with no
  # runner, then cancel after ~15m (zero steps) and fail the whole workflow —
  # see actions/runner#4833 and main run 43896514359. Darwin path logic is still
  # covered by unit stubs (e.g. claudeDesktopMcpPath(..., 'darwin')). Keep
  # ubuntu + windows for real OS coverage until macOS acquisition is reliable.
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run smoke
      - run: node scripts/test-integration.mjs

  host:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        vscode-version: ['1.105.0', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: xvfb-run -a npm run test:host
        env:
          VSCODE_VERSION: ${{ matrix.vscode-version }}

  # Single required status check for branch protection. Do not put optional /
  # flaky OS legs (e.g. macos-latest) in `needs` — add them as separate jobs
  # with continue-on-error and leave them out of this gate until capacity is stable.
  ci:
    name: CI
    needs: [lint, unit, integration, host]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all upstream jobs
        run: |
          set -euo pipefail
          results=(
            "${{ needs.lint.result }}"
            "${{ needs.unit.result }}"
            "${{ needs.integration.result }}"
            "${{ needs.host.result }}"
          )
          for r in "${results[@]}"; do
            if [[ "$r" != "success" ]]; then
              echo "Upstream job result was '$r' (want success)"
              exit 1
            fi
          done
          echo "All required jobs succeeded."
