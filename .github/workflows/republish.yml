name: Republish marketplaces

# Re-upload an existing GitHub Release VSIX when galleries lag or a publish needs retry.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.5.4)'
        required: true
        default: 'v0.5.4'

permissions:
  contents: read

jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download VSIX from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -p '*.vsix' -D .
          VSIX=$(ls -1 *.vsix | head -1)
          echo "VSIX=$VSIX" >> "$GITHUB_ENV"
          echo "Using $VSIX"
          EXPECTED="${TAG#v}"
          GOT=$(unzip -p "$VSIX" extension/package.json | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')
          echo "vsix version=$GOT expected=$EXPECTED"
          test "$GOT" = "$EXPECTED"

      - name: Publish to VS Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT not set"
            exit 1
          fi
          # Already-published is success for a retry workflow.
          set +e
          out=$(npx --yes @vscode/vsce publish --packagePath "$VSIX" --skip-duplicate --pat "$VSCE_PAT" 2>&1)
          code=$?
          echo "$out"
          if [ $code -eq 0 ] || echo "$out" | grep -qi 'already published\|Skipping publish'; then
            exit 0
          fi
          exit $code

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::error::OVSX_PAT not set"
            exit 1
          fi
          set +e
          out=$(npx --yes ovsx publish "$VSIX" --pat "$OVSX_PAT" 2>&1)
          code=$?
          echo "$out"
          # Inactive-but-published means the version exists (scan/activate lag) — not a retry failure.
          if [ $code -eq 0 ] || echo "$out" | grep -qi 'already published'; then
            exit 0
          fi
          exit $code
