name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Package VSIX
        run: npx @vscode/vsce package -o "mcp-watchdog-${{ github.ref_name }}.vsix"

      - name: Verify VSIX excludes dev paths
        run: |
          npx @vscode/vsce ls | grep -E 'test/|local\.md|launch/' && {
            echo "VSIX contains forbidden paths"
            exit 1
          } || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true

      - name: Publish to VS Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT not set — skip Marketplace publish (see CONTRIBUTING.md)"
            exit 0
          fi
          npx @vscode/vsce publish --skip-duplicate

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT not set — skip Open VSX publish (see CONTRIBUTING.md)"
            exit 0
          fi
          npx ovsx publish *.vsix --skip-duplicate
