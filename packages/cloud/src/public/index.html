<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Watchdog Cloud</title>
  <style>
    :root { --bg: #0f1419; --fg: #e7ecf1; --muted: #8b9aab; --accent: #3d8bfd; --ok: #3dd68c; --bad: #f07178; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "IBM Plex Sans", "Segoe UI", sans-serif; background: radial-gradient(1200px 600px at 10% -10%, #1a2740, var(--bg)); color: var(--fg); min-height: 100vh; }
    main { max-width: 920px; margin: 0 auto; padding: 3rem 1.5rem; }
    h1 { font-size: 2.4rem; letter-spacing: -0.03em; margin: 0 0 0.35rem; }
    .tag { color: var(--muted); margin-bottom: 2rem; }
    .toolbar { display: flex; justify-content: flex-end; margin-bottom: 1rem; }
    input { background: #182230; border: 1px solid #2a3a4d; color: var(--fg); padding: 0.6rem 0.75rem; border-radius: 6px; width: 100%; }
    input.invalid { border-color: var(--bad); }
    button { background: var(--accent); color: #fff; border: 0; padding: 0.6rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button.secondary { background: #243246; color: var(--fg); }
    button.ghost { background: transparent; border: 1px solid #2a3a4d; color: var(--fg); }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.55rem 0.4rem; border-bottom: 1px solid #243246; font-size: 0.95rem; }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
    h2 { margin-top: 2.5rem; font-size: 1.15rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
    dialog { border: 1px solid #2a3a4d; border-radius: 10px; padding: 0; background: #141c28; color: var(--fg); max-width: 28rem; width: calc(100% - 2rem); box-shadow: 0 24px 48px rgba(0,0,0,0.45); }
    dialog::backdrop { background: rgba(0,0,0,0.55); }
    .dialog-inner { padding: 1.25rem 1.5rem 1.5rem; }
    .dialog-inner h2 { margin: 0 0 1.25rem; font-size: 1.25rem; color: var(--fg); text-transform: none; letter-spacing: -0.02em; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.35rem; }
    .field { margin-bottom: 1rem; }
    .field-error { color: var(--bad); font-size: 0.8rem; margin-top: 0.35rem; min-height: 1.1rem; }
    .form-error { color: var(--bad); font-size: 0.85rem; margin-bottom: 0.75rem; min-height: 1.2rem; }
    .dialog-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: flex-end; margin-top: 0.5rem; }
    .checkbox-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.75rem 0 1rem; font-size: 0.9rem; color: var(--muted); }
    .checkbox-row input { width: auto; }
  </style>
</head>
<body>
  <main>
    <h1>Watchdog Cloud</h1>
    <p class="tag">Preview — remote health, schema changes, and policy checks. Not a proxy. With the opt-in IDE bridge enabled, the editor posts names-only incidents here.</p>
    <div class="toolbar">
      <button type="button" id="open-add">Add server</button>
    </div>
    <table>
      <thead><tr><th>Name</th><th>State</th><th>URL</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <h2>Dual-truth bridge</h2>
    <pre id="bridge" style="background:#182230;padding:1rem;border-radius:8px;overflow:auto;font-size:0.85rem"></pre>
    <h2>Policy audit</h2>
    <pre id="audit" style="background:#182230;padding:1rem;border-radius:8px;overflow:auto;font-size:0.85rem"></pre>
  </main>

  <dialog id="add-dialog" aria-labelledby="add-dialog-title">
    <form id="add-form" method="dialog" class="dialog-inner">
      <h2 id="add-dialog-title">Add server</h2>
      <p class="form-error" id="form-error" role="alert"></p>
      <div class="field">
        <label for="add-name">Server name</label>
        <input id="add-name" name="name" autocomplete="off" maxlength="64" required />
        <div class="field-error" id="name-error" role="alert"></div>
      </div>
      <div class="field">
        <label for="add-url">Server address / URL</label>
        <input id="add-url" name="url" type="url" placeholder="http://127.0.0.1:3921" autocomplete="off" required />
        <div class="field-error" id="url-error" role="alert"></div>
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="poll-now" name="pollNow" />
        Watch &amp; poll now
      </label>
      <div class="dialog-actions">
        <button type="button" class="secondary" id="add-cancel">Cancel</button>
        <button type="submit" value="watch">Watch server</button>
      </div>
    </form>
  </dialog>

  <script>
    const dialog = document.getElementById('add-dialog');
    const form = document.getElementById('add-form');
    const nameInput = document.getElementById('add-name');
    const urlInput = document.getElementById('add-url');
    const nameError = document.getElementById('name-error');
    const urlError = document.getElementById('url-error');
    const formError = document.getElementById('form-error');
    const pollNow = document.getElementById('poll-now');

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
    }

    function clearErrors() {
      formError.textContent = '';
      nameError.textContent = '';
      urlError.textContent = '';
      nameInput.classList.remove('invalid');
      urlInput.classList.remove('invalid');
    }

    function validateUrl(raw) {
      const v = String(raw || '').trim();
      if (!v) return 'Server address is required.';
      try {
        const u = new URL(v);
        if (u.protocol !== 'http:' && u.protocol !== 'https:') {
          return 'URL must use http or https.';
        }
      } catch {
        return 'Enter a valid http or https URL.';
      }
      return '';
    }

    function validateName(raw) {
      const v = String(raw || '').trim();
      if (!v) return 'Server name is required.';
      if (v.length > 64) return 'Name must be 1–64 characters.';
      return '';
    }

    function validateForm() {
      clearErrors();
      let ok = true;
      const ne = validateName(nameInput.value);
      const ue = validateUrl(urlInput.value);
      if (ne) { nameError.textContent = ne; nameInput.classList.add('invalid'); ok = false; }
      if (ue) { urlError.textContent = ue; urlInput.classList.add('invalid'); ok = false; }
      return ok;
    }

    function openAddDialog() {
      clearErrors();
      form.reset();
      dialog.showModal();
      nameInput.focus();
    }

    document.getElementById('open-add').onclick = openAddDialog;
    document.getElementById('add-cancel').onclick = () => dialog.close();

    async function refresh() {
      const servers = await fetch('/v1/servers').then(r => r.json());
      document.getElementById('rows').innerHTML = servers.map(s => `
        <tr>
          <td>${escapeHtml(s.name)}</td>
          <td class="${s.lastState === 'healthy' ? 'ok' : 'bad'}">${escapeHtml(s.lastState || '—')}</td>
          <td>${escapeHtml(s.url)}</td>
          <td><button data-id="${escapeHtml(s.id)}" class="poll">Poll</button></td>
        </tr>`).join('');
      document.querySelectorAll('.poll').forEach(btn => btn.onclick = async () => {
        await fetch('/v1/servers/' + btn.dataset.id + '/poll-now', { method: 'POST' });
        refresh();
      });
      document.getElementById('bridge').textContent = JSON.stringify(await fetch('/v1/bridge/incidents').then(r => r.json()), null, 2);
      document.getElementById('audit').textContent = JSON.stringify(await fetch('/v1/policy/audit').then(r => r.json()), null, 2);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!validateForm()) return;

      const name = nameInput.value.trim();
      const url = urlInput.value.trim();
      const shouldPoll = pollNow.checked;

      const res = await fetch('/v1/servers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, url }),
      });

      if (res.status === 409) {
        formError.textContent = 'A server with this name already exists.';
        nameInput.classList.add('invalid');
        nameInput.focus();
        return;
      }
      if (!res.ok) {
        formError.textContent = 'Could not add server. Try again.';
        return;
      }

      const created = await res.json();
      if (shouldPoll && created.id) {
        await fetch('/v1/servers/' + created.id + '/poll-now', { method: 'POST' });
      }

      dialog.close();
      refresh();
    });

    refresh();
  </script>
</body>
</html>
